[package]
name = "shot-villa"
version = "0.3.2"
description = "Screenshot- und Annotationswerkzeug für macOS und Windows"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Jascha Coenen"]
publish = false

[lib]
name = "shot_villa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-log = "2"
dirs = "6"
tauri-plugin-dialog = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-app-kit = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-media = "0.3"
objc2-image-io = "0.3"
objc2-vision = "0.3"
objc2-service-management = "0.3"
objc2-user-notifications = "0.3"

[target.'cfg(windows)'.dependencies]
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
rqrr = "0.11"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
xcap = "0.9"
windows-capture = "2.0"
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
