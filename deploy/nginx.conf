server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css text/html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location /images/ {
        expires 7d;
    }

    location /fonts/ {
        expires 30d;
    }

    location /downloads/ {
        types { application/x-apple-diskimage dmg; }
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
