# Compose-Stack für die Website (Dockhand-Stack "shot-villa", aus GitLab gebaut).
# Das Image baut die GitLab-Pipeline (.gitlab-ci.yml) in die Registry registry.villalife.de.
# Stackname, Dienstname und Port bleiben gleich: Der Proxy (shot-villa.villalife.de)
# findet den Container als shot-villa-website-1 auf Port 8098.
services:
  website:
    image: registry.villalife.de/jaschaaon/shot-villa/web:latest
    restart: unless-stopped
    ports:
      # Wie im bisherigen Stack (alle Adressen). Eine Beschränkung auf 127.0.0.1 oder
      # NetBird erst nach Prüfung, wie der Proxy den Container erreicht.
      - "0.0.0.0:8098:80"
    # Zugriffsprotokolle begrenzen; ältere Einträge werden überschrieben
    # (so in der Datenschutzerklärung beschrieben).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
