name: Windows

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Abhängigkeiten
        run: pnpm install --frozen-lockfile

      - name: Installer bauen
        run: pnpm tauri build --bundles nsis

      - name: Installer sichern
        uses: actions/upload-artifact@v4
        with:
          name: Screeni-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: An das Release hängen und Website neu bauen
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" src-tauri/target/release/bundle/nsis/*.exe --clobber
          gh workflow run website.yml --ref main
