name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "deploy/**"
      - ".github/workflows/website.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DMG aus dem neuesten Release holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p website/downloads
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --pattern '*-setup.exe' --dir website/downloads
          mv website/downloads/*.dmg website/downloads/Shot-VILLA.dmg
          if ls website/downloads/*-setup.exe >/dev/null 2>&1; then
            mv website/downloads/*-setup.exe website/downloads/Shot-VILLA-Setup.exe
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ghcr.io/jaschaaon/shot-villa-web:latest
