name: Release

# Ein Tag wie v0.3.3 baut macOS-DMG und Windows-Installer, legt das Release an,
# veröffentlicht die Update-Pakete samt latest.json (die App holt sie dort ab)
# und stößt danach den Website-Build an. Release-Ereignisse, die das
# GITHUB_TOKEN selbst auslöst, starten keine weiteren Workflows; deshalb
# erledigt dieser Workflow alles in einem Lauf.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Shot-VILLA ${GITHUB_REF_NAME#v}" --generate-notes

  macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Abhängigkeiten
        run: pnpm install --frozen-lockfile

      # Jede Version trägt dieselbe Signatur (selbstsigniertes Zertifikat
      # „Shot-VILLA Signing“). macOS knüpft die Freigaben (Bildschirmaufnahme,
      # Bedienungshilfen) an diese Identität; bei ad-hoc-Signatur würde es nach
      # jedem Update neu fragen. Das Zertifikat liegt als p12 in den Secrets.
      - name: Signaturzertifikat einrichten
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$APPLE_CERTIFICATE" ] || { echo "Secret APPLE_CERTIFICATE fehlt"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"

      # Die Update-Pakete (.app.tar.gz) signiert Tauri mit dem Schlüssel aus
      # dem Secret; ohne ihn schlägt der Build fehl.
      - name: DMG bauen
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Signatur prüfen
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Shot-VILLA.app
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep Authority
          codesign -d -r- "$app" 2>&1 | grep designated

      - name: An das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          gh release upload "$GITHUB_REF_NAME" "$bundle"/dmg/*.dmg "$bundle"/macos/*.app.tar.gz "$bundle"/macos/*.app.tar.gz.sig --clobber

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Abhängigkeiten
        run: pnpm install --frozen-lockfile

      - name: Installer bauen
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      - name: An das Release hängen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/*.exe.sig --clobber

  # Die App fragt latest.json ab: eine statische Datei am neuesten Release,
  # kein API-Aufruf und damit kein Abruflimit.
  manifest:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: latest.json erzeugen und anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir signatures
          node --experimental-strip-types scripts/write-updater-manifest.ts "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" signatures > latest.json
          cat latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --repo "$GITHUB_REPOSITORY" --clobber

  website:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - name: Website neu bauen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --repo "$GITHUB_REPOSITORY" --ref main
